<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Downshift"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Downshift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one phone-width column with a bottom tab bar. A rev gauge carries the
   Green / Yellow / Red check-in; everything else stays quiet so one job shows at a time. */
:root {
  --bg: #e9eff2; --surface: #f8fafb; --line: #c6d2d9; --ink: #12242f; --muted: #4c6170;
  --accent: #0f5e7a; --on-accent: #ffffff;
  --green: #4fc48d; --yellow: #f4c63f; --red: #ff7d68; --on-level: #12242f;
  --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body: "Atkinson Hyperlegible", Verdana, sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1a22; --surface: #162732; --line: #2c4351; --ink: #e8f0f4; --muted: #a0b5c1;
  --accent: #7fd0ea; --on-accent: #0d1a22; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d1a22; --surface: #162732; --line: #2c4351; --ink: #e8f0f4; --muted: #a0b5c1;
  --accent: #7fd0ea; --on-accent: #0d1a22; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.12; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; }
h2 { font-size: 1.35rem; }
p { margin: 0; }
.wrap { max-width: 540px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.mark { font: 800 1.1rem var(--display); letter-spacing: -.01em; }
.link { background: none; border: 0; padding: 6px 0; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.muted { color: var(--muted); }
.small { font-size: .92rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.tight { gap: 6px; }
.label { font-size: .8rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

/* Buttons */
.btn { min-height: 52px; padding: 12px 18px; border-radius: 12px; border: 2px solid var(--ink); background: transparent; font-weight: 700; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-family: var(--display); font-size: 1.15rem; }
.btn.small-btn { min-height: 44px; padding: 8px 14px; font-size: .95rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 130px; }

/* Check-in */
.bands { display: flex; flex-direction: column; gap: 10px; }
.band { display: block; width: 100%; border: 0; border-radius: 16px; padding: 18px 20px; min-height: 108px; text-align: left; color: var(--on-level); }
.band b { display: block; font: 800 1.9rem/1.1 var(--display); }
.band span { display: block; margin-top: 6px; }
.g { background: var(--green); } .y { background: var(--yellow); } .r { background: var(--red); }

/* Level chip */
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px 4px 8px; min-height: 44px; font-weight: 700; }
.chip svg { width: 40px; height: 24px; display: block; }

/* Next-up card */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.row > .field { flex: 1 1 140px; }
.field label { font-weight: 700; font-size: .95rem; }
input[type=text], input[type=time], input[type=date], textarea, select { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 16px; min-width: 0; }
textarea { min-height: 76px; resize: vertical; line-height: 1.4; }
input.title { font: 800 1.45rem/1.2 var(--display); background: transparent; border: 0; border-bottom: 2px solid var(--line); border-radius: 0; padding: 4px 0 8px; }
.note { border-left: 4px solid var(--accent); padding: 2px 0 2px 12px; }
.ifthen { font-style: italic; }

/* Task rows */
.list { display: flex; flex-direction: column; }
.task { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.task:last-child { border-bottom: 1px solid var(--line); }
.task .t { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.task.done .t { text-decoration: line-through; color: var(--muted); }
.check { flex: none; width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; padding: 0; }
.check i { width: 26px; height: 26px; border: 2px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: .9rem; line-height: 1; }
.check.on i { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.mini { flex: none; background: none; border: 0; color: var(--accent); font-size: .88rem; font-weight: 700; min-height: 44px; padding: 4px 6px; text-decoration: underline; text-underline-offset: 3px; }
.addline { display: flex; gap: 8px; }
.addline input { flex: 1 1 auto; }
.addline .btn { flex: none; min-height: 48px; padding: 8px 16px; }

/* Lists of tools */
.tool { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 12px 0; min-height: 64px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; }
.tool:last-child { border-bottom: 1px solid var(--line); }
.tool b { display: block; font-size: 1.08rem; }
.tool .tm { flex: none; font: 500 .85rem var(--mono); color: var(--muted); }
details { border-top: 1px solid var(--line); }
details:last-of-type { border-bottom: 1px solid var(--line); }
summary { list-style: none; cursor: pointer; padding: 14px 28px 14px 0; font-weight: 700; position: relative; min-height: 52px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; position: absolute; right: 4px; top: 10px; font: 500 1.4rem var(--mono); color: var(--muted); }
details[open] > summary::after { content: "\2212"; }
.body { padding: 0 0 18px; display: flex; flex-direction: column; gap: 12px; }
h3.sec { font-size: 1.25rem; padding: 14px 28px 14px 0; }
summary h3 { font-size: 1.25rem; }
summary h3 + span { display: block; font-weight: 400; font-size: .92rem; color: var(--muted); margin-top: 2px; }
ul.plain, ol.plain { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.quote { font-family: var(--display); font-weight: 600; font-size: 1.1rem; line-height: 1.3; }
.checkline { display: flex; align-items: center; gap: 6px; }
.step { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }

/* Tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs div { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { min-height: 62px; background: none; border: 0; border-top: 4px solid transparent; font-weight: 700; color: var(--muted); }
nav.tabs button[aria-current=page] { color: var(--ink); border-top-color: var(--accent); }

/* Full-screen layer for timers and resets */
#layer { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.screen { min-height: 100%; max-width: 540px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; display: flex; flex-direction: column; gap: 20px; }
.center { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; text-align: center; min-height: 300px; }
.clock { font: 500 clamp(4.5rem, 24vw, 7rem)/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.04em; }
.bar { width: 100%; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.ringbox { width: 220px; height: 220px; display: grid; place-items: center; }
.ring { width: 110px; height: 110px; border-radius: 50%; background: var(--accent); opacity: .85; transition: transform 1s ease-in-out; }
.ring.grow { transform: scale(1.95); transition-duration: 4s; }
.ring.shrink { transform: scale(1); transition-duration: 6s; }
.ring.hold { transform: scale(1.5); transition-duration: 5s; }
.big-n { font: 800 5.5rem/1 var(--display); }
.count { font: 500 2rem var(--mono); }
.dial { font: 800 2.6rem/1 var(--display); }
@media (prefers-reduced-motion: reduce) { .ring, .ring.grow, .ring.shrink, .ring.hold { transition: none; transform: scale(1.4); } }
</style>

<div id="app" class="wrap">
  <div class="top"><span class="mark">Downshift</span></div>
  <h1>How's your body right now?</h1>
</div>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<div id="layer" hidden></div>

<script>
(() => {
const KEY = 'downshift-v1', TIMER_KEY = 'downshift-timer';
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => dayKey(new Date());
const weekKey = () => { const d = new Date(); d.setDate(d.getDate() - d.getDay()); return dayKey(d); };
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);

const blankWeek = () => ({ key: weekKey(), sun: [false, false], top: ['', '', ''], hard: '', backup: '', pack: false, worked: '', blocked: '', change: '', lastChange: '' });
const blank = () => ({ updatedAt: 0, day: today(), level: null, resetDone: false, tasks: [], week: blankWeek(), big: [], plan: { signs: '', helps: '', where: '', who: '', adults: '' } });

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} }

let state = Object.assign(blank(), lsGet(KEY) || {});
const ui = { tab: 'today', open: new Set(), sync: 'device', confirm: null, layer: null };
const dow = new Date().getDay();
ui.open.add(dow === 5 ? 'fri' : 'sun');

/* A new day clears the check-in and finished work. Unfinished work stays. */
function rollover() {
  const t = today();
  if (state.day !== t) {
    state.day = t; state.level = null; state.resetDone = false;
    state.tasks = state.tasks.filter(x => !x.done);
    state.tasks.forEach(x => { if (x.snooze && x.snooze <= t) x.snooze = null; });
  }
  if (!state.week || state.week.key !== weekKey()) {
    const last = (state.week && state.week.change) || '';
    state.week = blankWeek(); state.week.lastChange = last;
  }
  lsSet(KEY, state);
}

/* Saving: this device right away, the viewer's private account storage shortly after. */
let ref = null, pushTimer = null, writing = false, again = false;
function save() { state.updatedAt = Date.now(); lsSet(KEY, state); clearTimeout(pushTimer); pushTimer = setTimeout(push, 800); }
async function push() {
  if (!ref) return;
  if (writing) { again = true; return; }
  writing = true;
  try { await ref.set(JSON.parse(JSON.stringify(state))); setSync('account'); }
  catch { setSync('device'); }
  writing = false;
  if (again) { again = false; push(); }
}
function setSync(v) { if (ui.sync !== v) { ui.sync = v; const el = $('sync-line'); if (el) el.textContent = syncText(); } }
const syncText = () => ui.sync === 'account' ? 'Saved to your account. Other people who open this page can’t see it.' : 'Saved on this device only.';
const typing = () => { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
async function pull() {
  if (!ref) return;
  try {
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : null;
    if (data && data.updatedAt > state.updatedAt) {
      if (typing()) return;
      state = Object.assign(blank(), data); rollover(); render();
    } else if (state.updatedAt > ((data && data.updatedAt) || 0)) { await push(); return; }
    setSync('account');
  } catch { setSync('device'); }
}
async function connect() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    ref = db.collection('data/users/' + id).doc('state');
    await pull();
  } catch { setSync('device'); }
}

const active = () => state.tasks.filter(t => !t.done && !t.snooze);
const later = () => state.tasks.filter(t => !t.done && t.snooze);
const finished = () => state.tasks.filter(t => t.done);
const findTask = id => state.tasks.find(t => t.id === id);
const newTask = title => ({ id: uid(), title, step: '', means: '', start: '', place: '', done: false, snooze: null, parked: null });
const fmtTime = v => { if (!v) return ''; let [h, m] = v.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };
const LEVELS = { green: { name: 'Green', c: 'g' }, yellow: { name: 'Yellow', c: 'y' }, red: { name: 'Red', c: 'r' } };

/* The rev gauge: green, yellow and red zones with a needle at today's level. */
function gauge(level) {
  const pt = (a, r) => [32 + r * Math.cos(a * Math.PI / 180), 34 - r * Math.sin(a * Math.PI / 180)].map(n => n.toFixed(2));
  const arc = (a, b, c) => { const [x1, y1] = pt(a, 26), [x2, y2] = pt(b, 26); return `<path d="M${x1} ${y1}A26 26 0 0 1 ${x2} ${y2}" fill="none" stroke="var(--${c})" stroke-width="8"/>`; };
  const ang = { green: 150, yellow: 90, red: 30 }[level] ?? 90;
  const [nx, ny] = pt(ang, 22);
  return `<svg viewBox="0 0 64 38" aria-hidden="true">${arc(178, 123, 'green')}${arc(117, 63, 'yellow')}${arc(57, 2, 'red')}<line x1="32" y1="34" x2="${nx}" y2="${ny}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></svg>`;
}

const top = () => `<div class="top"><span class="mark">Downshift</span><button class="link small" data-act="help">Need someone now?</button></div>`;
const dateLine = () => new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

/* ---------- Today ---------- */
function viewToday() {
  if (!state.level) return top() + `
    <div class="stack tight"><h1>How's your body right now?</h1><p class="muted">Body first, then homework. Pick the closest one.</p></div>
    <div class="bands">
      <button class="band g" data-act="level" data-v="green"><b>Green</b><span>Steady. I can think, talk, and start things.</span></button>
      <button class="band y" data-act="level" data-v="yellow"><b>Yellow</b><span>Revved up. Racing thoughts, irritable, restless, rushing, perfectionism.</span></button>
      <button class="band r" data-act="level" data-v="red"><b>Red</b><span>Overloaded. Panic, yelling, crying, freezing, or shutting down.</span></button>
    </div>`;

  if (state.level === 'red') {
    const p = state.plan;
    return top() + `
    <div class="stack tight"><h1>Homework can wait.</h1><p>Right now your only job is safety and space. Problem-solving comes later.</p></div>
    <p class="quote">"My alarm is going off. I don't have to solve everything right now."</p>
    <div class="stack tight">
      <p><b>Go to:</b> ${esc(p.where) || 'somewhere quiet and safe'}</p>
      <p><b>Talk to:</b> ${esc(p.who) || 'someone you trust'}</p>
      ${p.helps ? `<p><b>What helps me:</b> ${esc(p.helps)}</p>` : ''}
    </div>
    <div class="list">${toolRow('quiet')}${toolRow('breathe')}${toolRow('ground')}</div>
    <button class="btn primary" data-act="recheck">I'm calmer. Check again.</button>
    <p class="small">Not safe, or thinking about hurting yourself? <button class="link" data-act="help">Get help now</button></p>`;
  }

  if (state.level === 'yellow' && !state.resetDone) return top() + `
    <div class="top">${levelChip()}</div>
    <div class="stack tight"><h1>Bring it down first.</h1><p>Two minutes now makes starting easier. Then you'll pick one small task.</p></div>
    <button class="btn primary" data-act="reset" data-v="breathe">Start the 2-minute reset</button>
    <div class="row"><button class="btn" data-act="tab" data-v="reset">Choose a different reset</button></div>
    <button class="link" data-act="skip-reset">Skip for now</button>`;

  const list = active(), first = list[0], rest = list.slice(1), done = finished(), snz = later();
  let main;
  if (first) {
    const it = first.start && first.place ? `If it's ${esc(fmtTime(first.start))}, then I open this at ${esc(first.place)}.` : '';
    main = `<section class="hero" aria-label="Must-do">
      <label class="label" for="t-title">${state.level === 'yellow' ? 'One small task' : 'Must-do'}</label>
      <input class="title" id="t-title" type="text" data-t="${first.id}" data-f="title" value="${esc(first.title)}">
      ${first.parked ? `<p class="note small"><b>Last time you stopped at:</b> ${esc(first.parked.where) || 'not noted'}<br><b>Next:</b> ${esc(first.parked.next) || 'not noted'}</p>` : ''}
      <div class="field"><label for="t-step">First 5-minute step</label><input id="t-step" type="text" data-t="${first.id}" data-f="step" placeholder="Open the book to the right page" value="${esc(first.step)}"></div>
      <div class="field"><label for="t-means">"Done" means</label><input id="t-means" type="text" data-t="${first.id}" data-f="means" placeholder="Every problem tried, not perfect" value="${esc(first.means)}"></div>
      <div class="row">
        <div class="field"><label for="t-start">Start time</label><input id="t-start" type="time" data-t="${first.id}" data-f="start" value="${esc(first.start)}"></div>
        <div class="field"><label for="t-place">Place</label><input id="t-place" type="text" data-t="${first.id}" data-f="place" placeholder="Kitchen table" value="${esc(first.place)}"></div>
      </div>
      <p class="ifthen small" id="ifthen"${it ? '' : ' hidden'}>${it}</p>
      <button class="btn primary" data-act="focus" data-v="${first.id}" data-m="5">Start 5 minutes</button>
      <div class="row"><button class="btn small-btn" data-act="focus" data-v="${first.id}" data-m="15">15 min</button><button class="btn small-btn" data-act="focus" data-v="${first.id}" data-m="25">25 min</button></div>
    </section>`;
  } else if (done.length) {
    main = `<section class="hero"><h2>That's the list. Done is done.</h2><p>Stop here. Keep the last 30 to 60 minutes before bed away from schoolwork and stressful scrolling.</p></section>`;
  } else {
    main = `<section class="stack"><h2>What's the one thing that has to get done?</h2><p class="muted">Then add anything else you need to remember.</p></section>`;
  }
  const extra = dow === 0 ? ['It’s Sunday. Plan the week in 15 minutes.', 'Open the week plan'] : dow === 5 ? ['It’s Friday. Take 5 minutes to close out the week.', 'Open the Friday check'] : null;
  return top() + `
    <div class="top"><div><h1>Today</h1><p class="muted small">${esc(dateLine())}</p></div>${levelChip()}</div>
    ${main}
    <div class="stack">
      ${rest.length ? `<div class="stack tight"><span class="label">After that</span><div class="list">${rest.map(taskRow).join('')}</div></div>` : ''}
      ${list.length > 3 ? `<p class="small muted">That's a lot for one day. Move one to tomorrow if you can.</p>` : ''}
      <form class="addline" id="add-form"><input id="add-task" type="text" aria-label="Add to today's list" placeholder="${first ? 'Add something else' : 'Math p. 42, odd problems'}" autocomplete="off"><button class="btn" type="submit">Add</button></form>
      ${snz.length ? `<p class="small muted">${snz.length} moved to tomorrow.</p>` : ''}
      ${done.length ? `<div class="stack tight"><span class="label">Done today</span><div class="list">${done.map(taskRow).join('')}</div></div>` : ''}
    </div>
    ${extra ? `<p class="small">${extra[0]} <button class="link" data-act="tab" data-v="plan">${extra[1]}</button></p>` : ''}`;
}
const levelChip = () => `<button class="chip" data-act="recheck" aria-label="Today's level is ${LEVELS[state.level].name}. Check in again.">${gauge(state.level)}${LEVELS[state.level].name}</button>`;
function taskRow(t) {
  return `<div class="task${t.done ? ' done' : ''}">
    <button class="check${t.done ? ' on' : ''}" data-act="toggle" data-v="${t.id}" aria-label="${t.done ? 'Mark not done' : 'Mark done'}: ${esc(t.title)}"><i>${t.done ? '✓' : ''}</i></button>
    <span class="t">${esc(t.title)}</span>

/* Guided resets: a timeline of timed segments, or cards you tap through. */
function timeline(id) {
  if (id === 'breathe') { const a = []; for (let i = 0; i < 12; i++) a.push({ l: 'Breathe in', s: 4, c: 'grow' }, { l: 'Breathe out', s: 6, c: 'shrink' }); return a; }
  if (id === 'muscle') { const a = []; ['shoulders', 'hands', 'legs'].forEach(p => a.push({ l: `Tense your ${p}`, s: 5, c: 'grow' }, { l: 'Let go', s: 5, c: 'shrink' })); return a; }
  if (id === 'move') return [{ l: 'Walk, climb stairs, or do wall push-ups', s: 300, c: 'hold' }];
  return [{ l: 'Dim the lights, use headphones, or go somewhere quiet', s: 600, c: 'hold' }];
}
const GROUND = [[5, 'things you see'], [4, 'things you feel'], [3, 'things you hear'], [2, 'things you smell'], [1, 'thing you taste']];

    return layerOpen(`<div class="screen"><span class="label">Name it</span><div class="center"><p class="quote" style="font-size:1.7rem">"My alarm is going off. I don't have to solve everything right now."</p><p class="muted">Say it out loud or in your head.</p></div><button class="btn primary" data-act="reset-end">Done</button></div>`);
  }
  if (r.kind === 'cards') { ui.layer = { type: 'reset', id, i: 0 }; return groundCard(); }
  const segs = timeline(id);
  ui.layer = { type: 'reset', id, segs, start: Date.now(), total: segs.reduce((n, s) => n + s.s, 0), seg: -1 };

    <button class="btn" data-act="reset-end">End</button></div>`);

  help: showHelp,
  close: layerClose,
  level(v) { state.level = v; state.resetDone = false; save(); render(); window.scrollTo(0, 0); },
  recheck() { state.level = null; state.resetDone = false; save(); ui.tab = 'today'; render(); window.scrollTo(0, 0); },
  'skip-reset'() { state.resetDone = true; save(); render(); },
  reset(v) { primeAudio(); clearInterval(clock); startReset(v); },
  'reset-end'() { if (state.level === 'yellow' && !state.resetDone) { state.resetDone = true; save(); if (ui.tab !== 'today') ui.tab = 'today'; } layerClose(); },
  'ground-next'() { if (ui.layer.i === GROUND.length - 1) return resetFinished(); ui.layer.i++; groundCard(); },
  toggle(v) { const t = findTask(v); t.done = !t.done; save(); render(); },
  first(v) { const i = state.tasks.findIndex(t => t.id === v); state.tasks.unshift(state.tasks.splice(i, 1)[0]); save(); render(); },
  snooze(v) { const d = new Date(); d.setDate(d.getDate() + 1); findTask(v).snooze = dayKey(d); save(); render(); },
  focus(v, el) { startFocus(v, Number(el.dataset.m)); },
  'f-pause'() {
    const f = ui.layer;
    if (f.left != null) { f.endAt = Date.now() + f.left * 1000; f.left = null; $('f-pause').textContent = 'Pause'; }
    else { f.left = Math.max(0, Math.ceil((f.endAt - Date.now()) / 1000)); $('f-pause').textContent = 'Resume'; }
    saveTimer();
  },
  'f-stop'() { clearInterval(clock); clock = null; ui.layer.mode = 'park'; showFocus(); },
  'f-skipbreak'() { clearInterval(clock); clock = null; ui.layer.mode = 'breakover'; showFocus(); },
  'f-more'(v, el) { startFocus(ui.layer.id, Number(el.dataset.m), 'work'); ui.layer.firstFive = false; },
  'f-break'() { startFocus(ui.layer.id, 5, 'break'); },
  'f-done'() { const t = findTask(ui.layer.id); if (t) { t.done = true; t.parked = null; } lsDel(TIMER_KEY); save(); ui.tab = 'today'; layerClose(); },
  'f-parksave'() { const t = findTask(ui.layer.id); if (t) t.parked = { where: $('park-where').value.trim(), next: $('park-next').value.trim() }; lsDel(TIMER_KEY); save(); layerClose(); },
  'f-close'() { lsDel(TIMER_KEY); layerClose(); },
  'wk-sun'(v) { state.week.sun[v] = !state.week.sun[v]; save(); render(); },
  'wk-pack'() { state.week.pack = !state.week.pack; save(); render(); },
  'big-check'(v, el) { const s = state.big.find(b => b.id === v).steps[el.dataset.i]; s.done = !s.done; save(); render(); },
  'big-step'(v) { state.big.find(b => b.id === v).steps.push({ text: '', by: '', done: false }); save(); render(); },
  'big-today'(v, el) {
    const b = state.big.find(x => x.id === v), s = b.steps[el.dataset.i];
    if (!s.text.trim()) { $(`bs-${v}-${el.dataset.i}`).focus(); return; }
    state.tasks.push(newTask(`${b.title}: ${s.text.trim()}`)); save(); el.textContent = 'Added';
  },
  'big-del'(v) { if (ui.confirm === v) { state.big = state.big.filter(b => b.id !== v); ui.confirm = null; save(); } else ui.confirm = v; render(); },
  async 'copy-plan'() {
    const p = state.plan;
    const text = `My reset plan\nEarly warning signs: ${p.signs}\nTwo things that help: ${p.helps}\nWhere I can go: ${p.where}\nWho I can talk to: ${p.who}\nWhat I'd like adults to say or do: ${p.adults}`;
    try { await navigator.clipboard.writeText(text); $('copy-btn').textContent = 'Copied'; }
    catch { const a = $('copy-fallback'); a.value = text; a.hidden = false; a.focus(); a.select(); $('copy-btn').textContent = 'Select the text below and copy it'; }
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  actions[el.dataset.act](el.dataset.v, el);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'add-form') {
    const v = $('add-task').value.trim(); if (!v) return;
    state.tasks.push(newTask(v)); save(); render(); $('add-task').focus();
  }
  if (e.target.id === 'big-form') {
    const v = $('big-title').value.trim(); if (!v) return $('big-title').focus();
    const id = uid();
    state.big.push({ id, title: v, due: $('big-due').value, steps: [0, 1, 2].map(() => ({ text: '', by: '', done: false })), est: '', act: '', obstacle: '' });
    ui.open.add('big-' + id); save(); render();
  }
});
function setPath(path, val) { const k = path.split('.'); let o = state; while (k.length > 1) o = o[k.shift()]; o[k[0]] = val; }
function onField(e) {
  const d = e.target.dataset;
  if (d.b) { setPath(d.b, e.target.value); save(); }
  else if (d.t) {
    const t = findTask(d.t); if (!t) return;
    t[d.f] = e.target.value; save();
    const it = $('ifthen');
    if (it) { const s = t.start && t.place; it.hidden = !s; it.textContent = s ? `If it's ${fmtTime(t.start)}, then I open this at ${t.place}.` : ''; }
  } else if (d.big) {
    const b = state.big.find(x => x.id === d.big); if (!b) return;
    if (d.i != null) b.steps[d.i][d.f] = e.target.value; else b[d.f] = e.target.value;
    save();
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);
document.addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.key; if (k) e.target.open ? ui.open.add(k) : ui.open.delete(k); }, true);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (ui.layer && ui.layer.type === 'focus') { if (clock) { keepAwake(); tickFocus(); } }
  else if (!ui.layer) { const was = state.day; rollover(); if (was !== state.day && !typing()) render(); pull(); }
});

rollover();
render();
const saved = lsGet(TIMER_KEY);
if (saved && saved.type === 'focus' && findTask(saved.id)) { ui.layer = saved; showFocus(); }
connect();
})();
</script>
